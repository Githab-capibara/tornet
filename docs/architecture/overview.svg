<svg xmlns="http://www.w3.org/2000/svg" width="820" height="420" viewBox="0 0 820 420" font-family="sans-serif">
  <rect width="820" height="420" fill="#0d1117"/>

  <title>TorNet v2.0.2 architecture overview</title>
  <desc>Layered diagram: operator CLI on top, core engine with rotation/scheduler/auto-fix, Tor daemon and iptables kill switch below, geolocation APIs on the right.</desc>

  <!-- Layer labels -->
  <text x="20" y="42" fill="#8b949e" font-size="11" letter-spacing="1">OPERATOR</text>
  <text x="20" y="172" fill="#8b949e" font-size="11" letter-spacing="1">CORE ENGINE</text>
  <text x="20" y="342" fill="#8b949e" font-size="11" letter-spacing="1">SYSTEM / EXTERNAL</text>

  <!-- CLI box -->
  <rect x="140" y="20" width="240" height="44" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="260" y="47" fill="#c9d1d9" font-size="13" text-anchor="middle" font-weight="bold">tornet CLI (tornet.py)</text>

  <!-- Status / country input -->
  <rect x="430" y="20" width="180" height="44" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="520" y="37" fill="#c9d1d9" font-size="11" text-anchor="middle">--status / --ip / --country</text>
  <text x="520" y="53" fill="#8b949e" font-size="10" text-anchor="middle">flags &amp; JSON output</text>

  <!-- Engine boxes -->
  <rect x="140" y="110" width="240" height="44" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="260" y="137" fill="#c9d1d9" font-size="13" text-anchor="middle" font-weight="bold">Rotation engine</text>

  <rect x="140" y="170" width="240" height="44" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="260" y="197" fill="#c9d1d9" font-size="13" text-anchor="middle" font-weight="bold">Scheduler (--schedule)</text>

  <rect x="140" y="230" width="240" height="44" rx="6" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
  <text x="260" y="257" fill="#c9d1d9" font-size="13" text-anchor="middle" font-weight="bold">Auto-fix (utils.py)</text>

  <!-- Tor daemon -->
  <rect x="140" y="290" width="240" height="44" rx="6" fill="#161b22" stroke="#f85149" stroke-width="1.5"/>
  <text x="260" y="317" fill="#c9d1d9" font-size="13" text-anchor="middle" font-weight="bold">Tor daemon (control 9051)</text>

  <!-- iptables -->
  <rect x="430" y="290" width="180" height="44" rx="6" fill="#161b22" stroke="#f85149" stroke-width="1.5"/>
  <text x="520" y="317" fill="#c9d1d9" font-size="13" text-anchor="middle" font-weight="bold">iptables kill switch</text>

  <!-- Geolocation -->
  <rect x="660" y="110" width="140" height="44" rx="6" fill="#161b22" stroke="#bc8cff" stroke-width="1.5"/>
  <text x="730" y="137" fill="#c9d1d9" font-size="12" text-anchor="middle">ip-api.com</text>

  <rect x="660" y="170" width="140" height="44" rx="6" fill="#161b22" stroke="#bc8cff" stroke-width="1.5"/>
  <text x="730" y="197" fill="#c9d1d9" font-size="12" text-anchor="middle">ipapi.co</text>

  <!-- config/log storage -->
  <rect x="430" y="110" width="180" height="44" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="520" y="137" fill="#c9d1d9" font-size="12" text-anchor="middle">~/.tornet/ (config, log)</text>

  <!-- Arrows -->
  <g stroke="#58a6ff" stroke-width="1.2" fill="none">
    <line x1="260" y1="64" x2="260" y2="108"/>           <!-- CLI -> engine -->
    <line x1="260" y1="154" x2="260" y2="168"/>           <!-- engine -> scheduler -->
    <line x1="260" y1="214" x2="260" y2="228"/>           <!-- scheduler -> auto-fix -->
    <line x1="260" y1="274" x2="260" y2="288"/>           <!-- auto-fix -> tor -->
  </g>

  <g stroke="#8b949e" stroke-width="1.2" fill="none" stroke-dasharray="4 3">
    <line x1="520" y1="64" x2="520" y2="108"/>            <!-- status -> storage -->
    <line x1="380" y1="132" x2="658" y2="132"/>           <!-- engine -> ip-api -->
    <line x1="380" y1="192" x2="658" y2="192"/>           <!-- engine -> ipapi.co -->
    <line x1="382" y1="312" x2="428" y2="312"/>           <!-- tor -> iptables -->
  </g>

  <text x="20" y="405" fill="#8b949e" font-size="11">TorNet v2.0.2 — SOCKS on 9050, control on 9051; kill switch via TORNET-KILLSWITCH iptables chain; geo lookups degrade to raw IP when offline.</text>
</svg>