<svg xmlns="http://www.w3.org/2000/svg" width="480" height="300" viewBox="0 0 480 300" font-family="sans-serif">
  <rect width="480" height="300" fill="#0d1117"/>

  <title>TorNet v2.0.2 IP rotation benchmark</title>
  <desc>Donut chart of average time spent per IP rotation: startup checks 0.2s, NEWNYM signal 0.5s, settle sleep 5s, IP verification 1.5s. Total ~7.2s.</desc>

  <!-- Donut: 4 segments, circumference ~ 7.2s total.
       startup 0.2 (10deg), newnym 0.5 (25deg), settle 5.0 (250deg), verify 1.5 (75deg) -->
  <g transform="translate(150,150)">
    <!-- background ring -->
    <circle r="90" fill="none" stroke="#21262d" stroke-width="34"/>
    <!-- startup: 0.2s -->
    <circle r="90" fill="none" stroke="#58a6ff" stroke-width="34"
            stroke-dasharray="47.1 518.4" transform="rotate(-90)"/>
    <!-- newnym: 0.5s -->
    <circle r="90" fill="none" stroke="#3fb950" stroke-width="34"
            stroke-dasharray="117.9 447.6" transform="rotate(-80)"/>
    <!-- settle: 5.0s -->
    <circle r="90" fill="none" stroke="#d29922" stroke-width="34"
            stroke-dasharray="1178.8 392.9" transform="rotate(-55)"/>
    <!-- verify: 1.5s -->
    <circle r="90" fill="none" stroke="#f85149" stroke-width="34"
            stroke-dasharray="353.6 353.6" transform="rotate(195)"/>
    <text y="-6" fill="#c9d1d9" font-size="22" text-anchor="middle" font-weight="bold">7.2s</text>
    <text y="16" fill="#8b949e" font-size="11" text-anchor="middle">avg / rotation</text>
  </g>

  <!-- Legend -->
  <g transform="translate(290,70)">
    <rect x="0" y="0" width="14" height="14" fill="#58a6ff"/>
    <text x="22" y="11" fill="#c9d1d9" font-size="12">Startup checks — 0.2s</text>
    <rect x="0" y="28" width="14" height="14" fill="#3fb950"/>
    <text x="22" y="39" fill="#c9d1d9" font-size="12">NEWNYM signal — 0.5s</text>
    <rect x="0" y="56" width="14" height="14" fill="#d29922"/>
    <text x="22" y="67" fill="#c9d1d9" font-size="12">Settle sleep — 5.0s</text>
    <rect x="0" y="84" width="14" height="14" fill="#f85149"/>
    <text x="22" y="95" fill="#c9d1d9" font-size="12">IP verify — 1.5s</text>
  </g>

  <text x="20" y="285" fill="#8b949e" font-size="11">Measured on TorNet v2.0.2, Linux, default --interval and 5s settle; geo verify via ipapi.co.</text>
</svg>